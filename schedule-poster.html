    <title>玩劇寶貝｜兒童課程表線上編輯器</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

    <!-- Firebase：與 seat-system / photo-system 共用同一個 otto2-2026 專案 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQYP21uHGAeSj_i6ANMexMvp3_bciHvTw",
            authDomain: "otto2-2026.firebaseapp.com",
            databaseURL: "https://otto2-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "otto2-2026",
            storageBucket: "otto2-2026.appspot.com",
            appId: "1:108328085665:web:071a45a7d7c5af6b6468e0"
        };

        const app = initializeApp(firebaseConfig, "posterApp");
        const db = getDatabase(app);

        // 與 seat-system 完全相同的讀寫模式：course 整包陣列讀寫 seat3/courses
        window.fbGet = async (path) => get(ref(db, path));
        window.fbSet = async (path, data) => set(ref(db, path), data);
        window.fbReady = true;
    </script>

        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap');
        
        body {

        .schedule-table th,

        /* STRICT A4 PORTRAIT SINGLE-PAGE PRINT ENGINE */
        @media print {
            @page {

                height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;

                print-color-adjust: exact !important;
                overflow: hidden !important;
            }

            .no-print {
                display: none !important;
            }

            .print-page-container {

                height: 297mm !important;
                max-height: 297mm !important;
                padding: 3mm 6mm 0 6mm !important;
                box-sizing: border-box !important;

                box-shadow: none !important;

                break-inside: avoid !important;
                overflow: hidden !important;
            }

            .print-scale-box {
                transform-origin: top center !important;
                width: 100% !important;
            }

            .schedule-table {
                width: 100% !important;
                border-collapse: collapse !important;
                table-layout: fixed !important;
            }

            .schedule-table th, .schedule-table td {
                padding: 1.5px !important;
                border: 1px solid #475569 !important;
                vertical-align: top !important;
            }

            .course-card-print {
                padding: 1.5px 2px !important;
                margin-bottom: 1.5px !important;
                border-width: 1px !important;
                font-size: 8px !important;
                line-height: 1.15 !important;
                border-radius: 3px !important;
                box-shadow: none !important;
            }

            .print-badge {
                padding: 0px 2px !important;
                font-size: 7px !important;
            }
        }

        /* ============================================================
           DECORATIVE HEADER / FOOTER — sliced directly from the
           original "玩劇寶貝" reference artwork (actual bear/roof/
           palette illustration + bottom wave strip, not redrawn).
           Only visible in: (a) on-screen A4 print-preview, and
           (b) actual printing / PDF export. Never in edit mode.
           ============================================================ */
        .print-page-container { position: relative; }

        .print-frame-decor { display: none; }
        .print-page-container.is-print-preview .print-frame-decor { display: block; }
        @media print {
            .print-frame-decor { display: block !important; }
        }

        .print-css-banner { display: block; }
        .print-page-container.is-print-preview .print-css-banner { display: none; }
        @media print {
            .print-css-banner { display: none !important; }
        }

        .print-header-art {
            width: 100%;
            height: auto;
            margin: 0 auto -18px auto;
            pointer-events: none;
            user-select: none;
        }

        .print-footer-art {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: auto;
            z-index: 0;
            pointer-events: none;
            user-select: none;
        }

        .print-content-inner { position: relative; z-index: 2; }
        .print-page-container.is-print-preview .print-content-inner { padding-bottom: 16mm; }
        @media print {
            .print-content-inner { padding-bottom: 16mm !important; }
        }

        /* Custom subtle scrollbars for edit view */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        function App() {
            // Persistent States（改為從 Firebase seat3/courses、seat3/posterMeta 讀寫，
            // 與 seat-system 共用同一份課表資料，不再各自維護）
            const [schedule, setSchedule] = React.useState(null); // null = 尚未載入
            const [teachers, setTeachers] = React.useState(DEFAULT_TEACHERS);
            const [notices, setNotices] = React.useState(DEFAULT_NOTICES);
            const [phone, setPhone] = React.useState('04-2252-6006#20');
            const [lastUpdated, setLastUpdated] = React.useState('2026/06/01');
            const [dataLoaded, setDataLoaded] = React.useState(false);
            const [loadError, setLoadError] = React.useState(null);
            const hasLoadedOnceRef = React.useRef(false);

            // 首次載入：從 Firebase 抓即時課表與版面設定
            React.useEffect(() => {
                (async () => {
                    try {
                        const waitReady = () => new Promise(resolve => {
                            if (window.fbReady) return resolve();
                            const t = setInterval(() => {
                                if (window.fbReady) { clearInterval(t); resolve(); }
                            }, 50);
                        });
                        await waitReady();

                        const coursesSnap = await window.fbGet('seat3/courses');
                        if (coursesSnap && coursesSnap.exists()) {
                            const val = coursesSnap.val();
                            setSchedule(Array.isArray(val) ? val.filter(Boolean) : Object.values(val));
                        } else {
                            setSchedule(INITIAL_SCHEDULE);
                        }

                        const metaSnap = await window.fbGet('seat3/posterMeta');
                        if (metaSnap && metaSnap.exists()) {
                            const meta = metaSnap.val();
                            if (meta.teachers) setTeachers(meta.teachers);
                            if (meta.notices) setNotices(meta.notices);
                            if (meta.phone) setPhone(meta.phone);
                            if (meta.lastUpdated) setLastUpdated(meta.lastUpdated);
                        }
                    } catch (e) {
                        console.error('讀取 Firebase 失敗', e);
                        setLoadError('無法連線到 Firebase，請檢查網路連線後重新整理頁面。');
                        setSchedule(INITIAL_SCHEDULE);
                    } finally {
                        hasLoadedOnceRef.current = true;
                        setDataLoaded(true);
                    }
                })();
            }, []);

            // View & Filter States
            const [viewMode, setViewMode] = React.useState('edit'); // 'edit' | 'print'
            const [activeFilterAge, setActiveFilterAge] = React.useState('ALL');
            
            // Modal States
            const [activeModal, setActiveModal] = React.useState(null); // 'course' | 'teacher' | 'notices' | 'import'
            const [editingCourse, setEditingCourse] = React.useState(null);
            const [deleteConfirmCourse, setDeleteConfirmCourse] = React.useState(null);

            // Drag & Drop State
            const [draggedCourseId, setDraggedCourseId] = React.useState(null);

            // Dynamic Teacher Form State
            const [newTeacherName, setNewTeacherName] = React.useState('');
            const [newTeacherIcon, setNewTeacherIcon] = React.useState('🎨');

            // Import JSON Text
            const [importJsonText, setImportJsonText] = React.useState('');

            // Toast Alert State
            const [toast, setToast] = React.useState(null);

            // A4 Auto-Fit Dynamic Scale State
            const [printScale, setPrintScale] = React.useState(1.0);
            const printSheetRef = React.useRef(null);

            // Firebase Auto-Sync（載入完成前不寫回，避免用預設值覆蓋掉真實資料）
            const [syncStatus, setSyncStatus] = React.useState('idle'); // idle | saving | saved | error

            React.useEffect(() => {
                if (!hasLoadedOnceRef.current || schedule === null) return;
                setSyncStatus('saving');
                window.fbSet('seat3/courses', schedule)
                    .then(() => setSyncStatus('saved'))
                    .catch((e) => { console.error('寫入課表失敗', e); setSyncStatus('error'); });
            }, [schedule]);

            const saveMeta = React.useCallback((patch) => {
                if (!hasLoadedOnceRef.current) return;
                const meta = { teachers, notices, phone, lastUpdated, ...patch };
                window.fbSet('seat3/posterMeta', meta).catch((e) => console.error('寫入版面設定失敗', e));
            }, [teachers, notices, phone, lastUpdated]);

            React.useEffect(() => { saveMeta({ teachers }); }, [teachers]);
            React.useEffect(() => { saveMeta({ notices }); }, [notices]);
            React.useEffect(() => { saveMeta({ phone }); }, [phone]);
            React.useEffect(() => { saveMeta({ lastUpdated }); }, [lastUpdated]);

            // Auto-fit Engine Calculation for single page A4 guarantee
            const calculateA4Scale = React.useCallback(() => {
                if (!printSheetRef.current) return;
                
                // Target printable inner area height in px (standard ~1050px inside 297mm sheet)
                const container = printSheetRef.current;
                const contentInner = container.querySelector('.print-content-inner');
                if (!contentInner) return;

                const targetMaxHeight = 1010; // safe maximum inner height
                const actualHeight = contentInner.scrollHeight;

                if (actualHeight > targetMaxHeight) {
                    const ratio = Math.max(0.65, Math.min(1.0, targetMaxHeight / actualHeight));
                    setPrintScale(ratio);
                } else {
                    setPrintScale(1.0);
                }
            }, []);

            React.useEffect(() => {
                if (viewMode === 'print') {
                    calculateA4Scale();
                    window.addEventListener('resize', calculateA4Scale);
                    return () => window.removeEventListener('resize', calculateA4Scale);
                }
            }, [viewMode, schedule, calculateA4Scale]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 2800);
            };

            // STRICT GUARANTEED PERMANENT DELETION FUNCTION BY ID
            const executeDeleteCourse = (courseId) => {
                setSchedule(prev => prev.filter(item => String(item.id) !== String(courseId)));
                setDeleteConfirmCourse(null);
                if (activeModal === 'course' && editingCourse && String(editingCourse.id) === String(courseId)) {
                    setActiveModal(null);
                    setEditingCourse(null);
                }
                showToast('已永久刪除該課程', 'danger');
            };

            const handleOpenAddCourse = (col = '三', section = 'morning') => {
                setEditingCourse({
                    id: '',
                    col,
                    section,
                    name: '創意繪畫',
                    ageGroup: '2-3',
                    time: '10:00-10:50',
                    floor: '2F',
                    room: 'A',
                    icon: '🍎',
                    isNew: false
                });
                setActiveModal('course');
            };

            const handleOpenEditCourse = (course) => {
                setEditingCourse({ ...course });
                setActiveModal('course');
            };

            const handleSaveCourse = (e) => {
                e.preventDefault();
                if (!editingCourse.name.trim()) {
                    showToast('請輸入課程名稱', 'warning');
                    return;
                }

                if (editingCourse.id) {
                    setSchedule(prev => prev.map(c => String(c.id) === String(editingCourse.id) ? editingCourse : c));
                    showToast('課程已更新！', 'success');
                } else {
                    const newCourse = {
                        ...editingCourse,
                        id: 'c_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6)
                    };
                    setSchedule(prev => [...prev, newCourse]);
                    showToast('已新增課程！', 'success');
                }
                setActiveModal(null);
                setEditingCourse(null);
            };

            const handleAddTeacher = (e) => {
                e.preventDefault();
                if (!newTeacherName.trim()) return;
                const newT = {
                    id: 't_' + Date.now(),
                    name: newTeacherName.trim(),
                    icon: newTeacherIcon.trim() || '🎨'
                };
                setTeachers(prev => [...prev, newT]);
                setNewTeacherName('');
                showToast(`已新增老師「${newT.icon} ${newT.name}」`, 'info');
            };

            const handleDeleteTeacher = (id) => {
                setTeachers(prev => prev.filter(t => t.id !== id));
                showToast('已移除老師資料', 'info');
            };

            const handleResetDefaults = () => {
                setSchedule(INITIAL_SCHEDULE);
                setTeachers(DEFAULT_TEACHERS);
                setNotices(DEFAULT_NOTICES);
                setPhone('04-2252-6006#20');
                setLastUpdated('2026/06/01');
                showToast('已重置為官方預設課表', 'info');
            };

            const handleExportJSON = () => {
                const data = {
                    schedule,
                    teachers,
                    notices,
                    phone,
                    lastUpdated,
                    exportedAt: new Date().toISOString()
                };
                const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(
                    JSON.stringify(data, null, 2)
                )}`;
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute('href', jsonString);
                downloadAnchor.setAttribute('download', `play_baby_schedule_${Date.now()}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast('課表 JSON 資料已匯出！', 'success');
            };

            const handleImportJSON = () => {
                try {
                    const data = JSON.parse(importJsonText);
                    if (data.schedule && Array.isArray(data.schedule)) {
                        setSchedule(data.schedule);
                        if (data.teachers) setTeachers(data.teachers);
                        if (data.notices) setNotices(data.notices);
                        if (data.phone) setPhone(data.phone);
                        if (data.lastUpdated) setLastUpdated(data.lastUpdated);
                        setActiveModal(null);
                        setImportJsonText('');
                        showToast('已成功匯入 JSON 課表資料！', 'success');
                    } else {
                        showToast('無效的 JSON 課表格式', 'danger');
                    }
                } catch (e) {
                    showToast('JSON 解析錯誤，請檢查格式', 'danger');
                }
            };

            // Drag & Drop Handlers
            const handleDragStart = (e, courseId) => {
                e.dataTransfer.setData('text/plain', courseId);
                setDraggedCourseId(courseId);
            };

            const handleDropOnSlot = (e, targetDay, targetSection) => {
                e.preventDefault();
                const courseId = e.dataTransfer.getData('text/plain') || draggedCourseId;
                if (!courseId) return;

                setSchedule(prev => prev.map(c => {
                    if (String(c.id) === String(courseId)) {
                        return { ...c, day: targetDay, section: targetSection };
                    }
                    return c;
                }));
                setDraggedCourseId(null);
                showToast('課程位置已拖曳移動', 'info');
            };

            const getFilteredCourses = (dayKey, sectionKey) => {
                return (schedule || []).filter(c => {
                    const matchesDaySec = c.col === dayKey && c.section === sectionKey;
                    const matchesAge = activeFilterAge === 'ALL' || c.ageGroup === activeFilterAge;
                    return matchesDaySec && matchesAge;
                });
            };

            if (!dataLoaded || schedule === null) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <div className="w-10 h-10 border-4 border-rose-200 border-t-rose-500 rounded-full animate-spin mx-auto mb-3"></div>
                            <div className="text-slate-500 text-sm font-bold">讀取即時課表中…</div>
                            {loadError && <div className="text-rose-500 text-xs mt-2">{loadError}</div>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-12">
                    
                    {/* TOAST NOTIFICATION BANNER */}
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 text-white font-extrabold text-xs sm:text-sm animate-bounce no-print ${
                            toast.type === 'danger' ? 'bg-red-600 border border-red-400' :
                            toast.type === 'warning' ? 'bg-amber-600 border border-amber-400' :
                            toast.type === 'info' ? 'bg-sky-600 border border-sky-400' : 'bg-emerald-600 border border-emerald-400'

                            <i className={`fa-solid ${toast.type === 'danger' ? 'fa-trash-can' : 'fa-circle-check'}`}></i>
                            <span>{toast.message}</span>

                    {/* TOP ACTION TOOLBAR (EDIT & PRINT PREVIEW SWITCHER) */}

                                <div>

                                </div>
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                    syncStatus === 'saving' ? 'bg-amber-400/20 text-amber-300' :
                                    syncStatus === 'error' ? 'bg-rose-500/20 text-rose-300' :
                                    syncStatus === 'saved' ? 'bg-emerald-500/20 text-emerald-300' :
                                    'bg-slate-700 text-slate-400'
                                }`}>
                                    {syncStatus === 'saving' ? '● 同步中…' : syncStatus === 'error' ? '● 同步失敗' : syncStatus === 'saved' ? '● 已同步 Firebase' : '● 即時課表'}
                                </span>
                            </div>

                            {/* View Switcher Controls */}
                            <div className="flex items-center gap-1.5 sm:gap-2">
                                <button
                                    onClick={() => setViewMode('edit')}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1.5 ${
                                        viewMode === 'edit' ? 'bg-rose-500 text-white shadow-sm' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                    }`}>
                                    <i className="fa-solid fa-pen-to-square"></i> 編輯模式
                                </button>
                                
                                <button
                                    onClick={() => {
                                        setViewMode('print');
                                        setTimeout(calculateA4Scale, 100);
                                    }}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1.5 ${
                                        viewMode === 'print' ? 'bg-amber-500 text-slate-950 shadow-sm' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                    }`}>
                                    <i className="fa-solid fa-print"></i> A4 列印預覽
                                </button>

                                    onClick={() => window.print()}

                                    <i className="fa-solid fa-paper-plane"></i> 直接列印
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* SECONDARY EDITING TOOLBAR */}
                    {viewMode === 'edit' && (
                        <div className="no-print bg-white border-b border-slate-200 shadow-xs sticky top-[49px] z-30">

                                        onClick={() => setActiveModal('teacher')}
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-2.5 py-1.5 rounded-lg transition flex items-center gap-1">
                                        <i className="fa-solid fa-user-gear text-slate-500"></i> 老師管理
                                    </button>

                                    <button
                                        onClick={() => setActiveModal('notices')}
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-2.5 py-1.5 rounded-lg transition flex items-center gap-1">
                                        <i className="fa-solid fa-clipboard-list text-slate-500"></i> 注意事項與電話

                                    </button>

                                    {/* Existing Teachers List */}
                                    <div className="space-y-1.5 max-h-56 overflow-y-auto pr-1">
                                        <span className="text-xs font-black text-slate-500 block mb-1">現有老師清單 ({teachers.length})</span>
                                        {teachers.map(t => (
                                            <div key={t.id} className="flex items-center justify-between p-2 rounded-xl bg-slate-100 hover:bg-slate-200/70 transition">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-base">{t.icon}</span>
                                                    <span className="text-xs font-bold text-slate-800">{t.name}</span>
                                                </div>
                                                <button 
                                                    type="button"
                                                    onClick={() => handleDeleteTeacher(t.id)}
                                                    className="text-slate-400 hover:text-red-600 p-1 text-xs transition">
                                                    <i className="fa-solid fa-trash-can"></i>
                                                </button>
                                            </div>
                                        ))}
                                    </div>

                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 3: EDIT NOTICES & PHONE */}
                    {activeModal === 'notices' && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 no-print">
                            <div className="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl border border-slate-100 max-h-[92vh] overflow-y-auto">
                                
                                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                                    <h3 className="text-base font-black text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-clipboard-list text-amber-500"></i> 注意事項與資訊設定
                                    </h3>
                                    <button 
                                        type="button"
                                        onClick={() => setActiveModal(null)}
                                        className="text-slate-400 hover:text-slate-600 w-7 h-7 rounded-full flex items-center justify-center hover:bg-slate-100">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="mt-3 space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">預約電話</label>
                                        <input 
                                            type="text"
                                            value={phone}
                                            onChange={(e) => setPhone(e.target.value)}
                                            className="w-full px-3 py-1.5 border border-slate-300 rounded-xl text-xs font-bold"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">最後更新日期</label>
                                        <input 
                                            type="text"
                                            value={lastUpdated}
                                            onChange={(e) => setLastUpdated(e.target.value)}
                                            className="w-full px-3 py-1.5 border border-slate-300 rounded-xl text-xs font-bold"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">注意事項條目 (每行一條)</label>
                                        <textarea
                                            rows={5}
                                            value={notices.join('\n')}
                                            onChange={(e) => setNotices(e.target.value.split('\n').filter(Boolean))}
                                            className="w-full p-3 border border-slate-300 rounded-xl text-xs font-medium leading-relaxed"
                                        />
                                    </div>

                                    <button 
                                        onClick={() => {
                                            setActiveModal(null);
                                            showToast('資訊設定已更新', 'success');
                                        }}
                                        className="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 rounded-xl text-xs transition">
                                        完成儲存
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 4: IMPORT / EXPORT JSON */}
                    {activeModal === 'import' && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 no-print">
                            <div className="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl border border-slate-100 max-h-[92vh] overflow-y-auto">
                                
                                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                                    <h3 className="text-base font-black text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-file-import text-sky-500"></i> 匯入 / 匯出 課表 JSON
                                    </h3>
                                    <button 
                                        type="button"
                                        onClick={() => setActiveModal(null)}
                                        className="text-slate-400 hover:text-slate-600 w-7 h-7 rounded-full flex items-center justify-center hover:bg-slate-100">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="mt-3 space-y-4">
                                    
                                    {/* Export */}
                                    <div className="bg-sky-50 p-3 rounded-2xl border border-sky-200">
                                        <span className="text-xs font-black text-sky-950 block mb-1">匯出完整備份檔</span>
                                        <p className="text-[11px] text-sky-800 mb-2">下載目前包含課程、老師圖章與注意事項的 JSON 檔案。</p>
                                        <button 
                                            onClick={handleExportJSON}
                                            className="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-1.5 rounded-xl text-xs transition">
                                            <i className="fa-solid fa-download"></i> 下載 JSON 備份檔案
                                        </button>
                                    </div>

                                    {/* Import */}
                                    <div className="space-y-2">
                                        <span className="text-xs font-black text-slate-700 block">貼上 JSON 碼進行匯入</span>
                                        <textarea
                                            rows={5}
                                            placeholder="貼上匯出的 JSON 內容..."
                                            value={importJsonText}
                                            onChange={(e) => setImportJsonText(e.target.value)}
                                            className="w-full p-2.5 border border-slate-300 rounded-xl text-[11px] font-mono"
                                        />
                                        <button 
                                            onClick={handleImportJSON}
                                            className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-xl text-xs transition">
                                            確認匯入覆蓋課表
                                        </button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 5: DELETE CONFIRMATION SAFETY DIALOG */}
                    {deleteConfirmCourse && (
                        <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-3 no-print">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-red-100 text-center animate-scaleIn">
                                <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 mx-auto flex items-center justify-center text-xl mb-3">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                </div>
                                <h3 className="text-base font-black text-slate-800 mb-1">確定要刪除這堂課嗎？</h3>
                                <p className="text-xs text-slate-500 mb-4">
                                    「<span className="font-bold text-slate-800">{deleteConfirmCourse.name}</span> ({deleteConfirmCourse.ageGroup})」刪除後將無法恢復。
                                </p>
                                <div className="flex items-center justify-center gap-2">
                                    <button 
                                        type="button"
                                        onClick={() => setDeleteConfirmCourse(null)}
                                        className="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 font-bold text-xs hover:bg-slate-100">
                                        取消
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={() => executeDeleteCourse(deleteConfirmCourse.id)}
                                        className="bg-red-600 hover:bg-red-700 text-white font-black px-4 py-2 rounded-xl text-xs shadow-sm">
                                        確定刪除
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Render React Application Root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
