<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玩劇寶貝｜課表 & 學位管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#f4a261;--orange-d:#e07b3c;--bg:#fdf8f3;--surface:#fff;
  --border:#f0e8df;--text:#3a2f28;--text2:#7a6a5a;--text3:#b0a090;
  --red:#c0392b;--red-bg:#fff0ee;--amber:#8b6914;--amber-bg:#fef9ee;
  --green:#1a7a3c;--green-bg:#eef9f2;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── NAV ── */
.header{background:linear-gradient(135deg,#f9a26c,#f4845a);padding:0 20px;display:flex;align-items:center;gap:0;height:52px;box-shadow:0 2px 8px rgba(0,0,0,.12);position:sticky;top:0;z-index:100}
.logo{font-size:16px;font-weight:700;color:#fff;letter-spacing:1px;margin-right:20px;white-space:nowrap}
.nav-tabs{display:flex;gap:2px;flex:1}
.nav-tab{background:none;border:none;color:rgba(255,255,255,.65);padding:0 14px;height:52px;cursor:pointer;font-size:13px;font-family:inherit;border-bottom:2.5px solid transparent;transition:all .15s}
.nav-tab.active{color:#fff;border-bottom-color:#fff}
.nav-tab:hover{color:#fff}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#f5c6a0;margin-left:auto;flex-shrink:0}
.sync-dot.ok{background:#2ecc71}.sync-dot.err{background:#e74c3c}

/* ── PAGES ── */
.page{display:none;padding:16px 20px;max-width:1400px;margin:0 auto}
.page.active{display:block}

/* ── SCHEDULE PAGE ── */
.sch-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0 12px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab-bar{display:flex;gap:5px}
.tab{padding:5px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid #e8d5c4;background:var(--bg);color:var(--text2);font-weight:500;transition:all .15s}
.tab:hover{border-color:var(--orange);color:var(--orange)}
.tab.active{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:0 2px 6px rgba(244,162,97,.35)}
.spacer{flex:1}
.btn{font-size:12px;padding:5px 13px;border:1.5px solid #e8d5c4;border-radius:8px;background:#fff;color:var(--text2);cursor:pointer;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn.danger{background:var(--red-bg);border-color:#f5c6c2;color:var(--red)}
.btn.danger:hover{background:#fde0dc}

/* ── SCHEDULE TABLE ── */
.table-wrap{overflow-x:auto;padding-bottom:24px}
.schedule-table{border-collapse:collapse;font-size:11px;min-width:800px;width:100%}
.schedule-table th{padding:6px 4px;text-align:center;border:1px solid #e8d9cc;font-weight:600;color:#5a4a3a;font-size:11.5px;background:#f8f0e3}
.schedule-table th.sat-head{background:#fde8d0;color:#a05020}
.schedule-table th.sun-head{background:#fddfd0;color:#a03020}
.schedule-table td{border:1px solid #e8d9cc;vertical-align:top;padding:2px}
.section-label{background:#f0e8d8;text-align:center;font-size:12px;color:#5a4a3a;font-weight:700;writing-mode:vertical-rl;width:22px;padding:6px 2px}
.time-label{background:#f8f0e3;text-align:center;font-size:9px;color:#5a4a3a;font-weight:500;width:48px;padding:4px 2px;line-height:1.4;white-space:pre-line}
.cell-inner{min-height:48px;display:flex;flex-direction:column;gap:2px;padding:2px}
.cell-sat{background:#fffbf5}.cell-sun{background:#fff8f5}

/* ── COURSE CARD ── */
.course-card{border-radius:5px;padding:3px 5px;cursor:pointer;font-size:10px;line-height:1.35;border:1.5px solid transparent;transition:box-shadow .15s,transform .1s;position:relative}
.course-card:hover{box-shadow:0 0 0 2px var(--orange);transform:scale(1.01);z-index:2}
.course-card.has-alert{border-color:#e74c3c!important}
.course-card.has-observe{border-color:#EF9F27!important}
.course-card .cn{font-weight:600;font-size:10.5px}
.course-card .ct{color:rgba(0,0,0,.55);font-size:9px}
.course-card .ci{font-size:13px;float:right;margin-left:2px;line-height:1}
.course-card .seat-bar{height:3px;border-radius:2px;margin-top:3px;background:#e8d9cc;overflow:hidden}
.course-card .seat-fill{height:100%;border-radius:2px;background:var(--green);transition:width .3s}
.course-card .seat-fill.near{background:var(--orange)}
.course-card .seat-fill.full{background:var(--red)}
.course-card .seat-count{font-size:8px;color:rgba(0,0,0,.45);margin-top:1px}
.badge-new{float:right;font-size:7.5px;background:var(--orange);color:#fff;padding:0 3px;border-radius:3px;margin-left:2px;font-weight:700}
.add-btn{width:100%;min-height:22px;border:1.5px dashed #d8c8b8;border-radius:5px;cursor:pointer;background:transparent;color:#c0a898;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.add-btn:hover{border-color:var(--orange);color:var(--orange);background:#fff8f2}

/* ── SEAT PANEL (right side) ── */
.main-layout{display:flex;gap:16px;align-items:flex-start}
.schedule-col{flex:1;min-width:0}
.seat-panel{width:340px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto;display:none}
.seat-panel.open{display:block}
.seat-panel-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.seat-panel-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text3);margin-left:auto;padding:0;line-height:1}
.seat-panel-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.3}
.seat-panel-meta{font-size:11px;color:var(--text2);margin-top:3px}
.seat-cap-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 10px;background:var(--bg);border-radius:8px}
.seat-cap-bar{flex:1;height:6px;background:#e8d9cc;border-radius:3px;overflow:hidden}
.seat-cap-fill{height:100%;border-radius:3px;background:var(--green);transition:width .3s}
.seat-cap-fill.near{background:var(--orange)}.seat-cap-fill.full{background:var(--red)}
.seat-section-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.student-chip{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;background:var(--bg);border:1px solid var(--border);margin-bottom:5px;cursor:default;transition:background .1s}
.student-chip:hover{background:#f5ede4}
.student-chip.alert-red{background:var(--red-bg);border-color:#f5c6c2}
.student-chip.alert-amber{background:var(--amber-bg);border-color:#f5dfa0}
.student-chip.paused{opacity:.6}
.student-chip .sc-name{flex:1;font-size:12px;font-weight:500}
.student-chip .sc-badge{font-size:10px;padding:1px 6px;border-radius:99px;background:rgba(0,0,0,.06);color:var(--text2)}
.student-chip .sc-note{font-size:10px;color:var(--text3)}
.student-chip .sc-rm{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:0;display:none}
.student-chip:hover .sc-rm{display:block}
.waitlist-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;background:var(--bg);border:1px solid var(--border);margin-bottom:5px}
.wl-num{width:20px;height:20px;border-radius:50%;background:var(--text2);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wl-info{flex:1}
.wl-name{font-size:12px;font-weight:500}
.wl-meta{font-size:10px;color:var(--text3)}
.add-student-row{display:flex;gap:6px;margin-top:8px}
.add-student-row input{flex:1;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;outline:none}
.add-student-row input:focus{border-color:var(--orange)}
.seat-actions{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap}

/* ── ALERT PAGE ── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.stat-val{font-size:24px;font-weight:700;color:var(--text)}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:2px}
.stat.red .stat-val{color:var(--red)}.stat.amber .stat-val{color:var(--amber)}.stat.green .stat-val{color:var(--green)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.card-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 10px;background:#f8f0e3;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fdf8f3}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:600}
.badge.red{background:var(--red-bg);color:var(--red)}.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.green{background:var(--green-bg);color:var(--green)}.badge.gray{background:#f0e8df;color:var(--text2)}
.filter-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-tab{padding:4px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:11px;cursor:pointer;transition:all .1s}
.filter-tab.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:5px 9px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;background:var(--surface);color:var(--text);outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--orange)}

/* ── MODALS ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(58,47,40,.45);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--text)}
.form-row{margin-bottom:11px}
.form-row label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:600}
.form-row input,.form-row select,.form-row textarea{width:100%;font-size:12px;padding:6px 9px;border:1.5px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;transition:border-color .15s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--orange);background:#fff}
.icon-picker{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.icon-opt{width:32px;height:32px;border-radius:7px;border:1.5px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--bg);transition:all .15s}
.icon-opt:hover,.icon-opt.sel{border-color:var(--orange);background:#fff0e4}
.color-picker{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.color-opt{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all .15s}
.color-opt:hover{transform:scale(1.1)}.color-opt.sel{outline:2.5px solid var(--text);outline-offset:2px}
.modal-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.suggest-box{border:1px solid var(--border);border-radius:6px;margin-top:3px;max-height:140px;overflow-y:auto;display:none;background:#fff}
.suggest-item{padding:6px 9px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border)}
.suggest-item:last-child{border-bottom:none}
.suggest-item:hover{background:var(--bg)}

/* ── HISTORY ── */
.history-item{padding:9px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.history-item:last-child{border-bottom:none}
.h-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.h-content{flex:1}
.h-meta{font-size:10px;color:var(--text3);margin-top:2px}

/* ── IMPORT ── */
.drop-zone{border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;cursor:pointer;transition:all .15s}
.drop-zone:hover,.drop-zone.drag{border-color:var(--orange);background:#fff8f2}
.drop-zone p{color:var(--text2);font-size:12px;margin-top:6px}

/* ── TOAST ── */
#toast{position:fixed;bottom:22px;right:22px;background:#3a2f28;color:#fff;padding:9px 16px;border-radius:8px;font-size:12px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

@media(max-width:900px){.seat-panel{display:none!important}.main-layout{display:block}}
@media(max-width:600px){.nav-tab{padding:0 9px;font-size:11px}.page{padding:10px 12px}}
</style>
</head>
<body>

<div class="header">
  <span class="logo">🎨 玩劇寶貝</span>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('schedule',this)">課表</button>
    <button class="nav-tab" onclick="showPage('alert',this)">缺席警示</button>
    <button class="nav-tab" onclick="showPage('waitlist',this)">候補名單</button>
    <button class="nav-tab" onclick="showPage('changes',this)">異動紀錄</button>
    <button class="nav-tab" onclick="showPage('import',this)">匯入資料</button>
  </div>
  <div class="sync-dot" id="syncDot" title="Firebase 連線中"></div>
</div>

<div id="toast"></div>

<!-- ═══ PAGE: 課表 ═══ -->
<div class="page active" id="page-schedule">
  <div class="sch-toolbar">
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('all',this)">全年齡</div>
      <div class="tab" onclick="switchTab('2-3',this)">2-3歲</div>
      <div class="tab" onclick="switchTab('4-5',this)">4-5歲</div>
      <div class="tab" onclick="switchTab('6+',this)">6+歲</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" onclick="openAddCourseModal(null,null)">＋ 新增課程</button>
  </div>
  <div class="main-layout">
    <div class="schedule-col">
      <div class="table-wrap"><div id="tableContainer"></div></div>
    </div>
    <div class="seat-panel" id="seatPanel">
      <div class="seat-panel-header">
        <div>
          <div class="seat-panel-title" id="spTitle">班級名稱</div>
          <div class="seat-panel-meta" id="spMeta"></div>
        </div>
        <button class="seat-panel-close" onclick="closeSeatPanel()">✕</button>
      </div>
      <div class="seat-cap-row">
        <span style="font-size:11px;color:var(--text2)">學位</span>
        <div class="seat-cap-bar"><div class="seat-cap-fill" id="spCapFill" style="width:0%"></div></div>
        <span style="font-size:12px;font-weight:600" id="spCapText">0/8</span>
        <button class="btn" style="padding:2px 8px;font-size:11px" onclick="editCapacity()">上限</button>
      </div>
      <div class="seat-section-title">固定學位</div>
      <div id="spStudents"></div>
      <div class="add-student-row">
        <input type="text" id="newStudentInput" placeholder="輸入學生姓名…" oninput="filterStudentSugg()" onkeydown="if(event.key==='Enter')addStudentFromInput()">
        <button class="btn primary" onclick="addStudentFromInput()">新增</button>
      </div>
      <div class="suggest-box" id="studentSuggBox"></div>
      <div class="seat-section-title">候補名單</div>
      <div id="spWaitlist"></div>
      <button class="btn" style="width:100%;margin-top:6px;justify-content:center" onclick="openAddWlModal()">＋ 新增候補</button>
      <div class="seat-actions">
        <button class="btn danger" style="font-size:11px" onclick="deleteCourseFromPanel()">刪除課程</button>
        <button class="btn" style="font-size:11px;margin-left:auto" onclick="openEditCourseModal()">編輯課程資訊</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ PAGE: 缺席警示 ═══ -->
<div class="page" id="page-alert">
  <div class="stat-row">
    <div class="stat"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">分析學員數</div></div>
    <div class="stat red"><div class="stat-val" id="s-red">—</div><div class="stat-lbl">🔴 應釋出學位</div></div>
    <div class="stat amber"><div class="stat-val" id="s-amber">—</div><div class="stat-lbl">🟡 持續觀察</div></div>
    <div class="stat green"><div class="stat-val" id="s-coverage">—</div><div class="stat-lbl">資料月份</div></div>
  </div>
  <div class="filter-tabs" id="alertFilterTabs">
    <button class="filter-tab active" onclick="setAlertFilter('all',this)">全部</button>
    <button class="filter-tab" onclick="setAlertFilter('應釋出學位',this)">🔴 應釋出學位</button>
    <button class="filter-tab" onclick="setAlertFilter('持續觀察',this)">🟡 持續觀察</button>
    <button class="filter-tab" onclick="setAlertFilter('正常追蹤',this)">🟢 正常追蹤</button>
  </div>
  <div class="toolbar">
    <input type="text" id="alertSearch" placeholder="搜尋學員…" oninput="renderAlertTable()" style="width:180px">
    <select id="alertAge" onchange="renderAlertTable()">
      <option value="">所有年齡</option>
      <option>2-3歲</option><option>4-5歲</option><option>6-8歲</option><option>9-12歲</option>
    </select>
    <button class="btn" onclick="exportAlertCSV()">匯出名單</button>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <div class="tbl-wrap">
      <table><thead><tr>
        <th>風險</th><th>學員</th><th>課程</th><th>教室</th><th>老師</th>
        <th>總堂</th><th>缺席</th><th>缺席率</th><th>連續</th><th>月份</th><th>操作</th>
      </tr></thead>
      <tbody id="alertBody"><tr><td colspan="11" style="text-align:center;color:var(--text3);padding:28px">尚未匯入資料</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══ PAGE: 候補名單 ═══ -->
<div class="page" id="page-waitlist">
  <div class="toolbar">
    <select id="wlClassFilter" onchange="renderWaitlistPage()"><option value="">所有班級</option></select>
    <button class="btn primary" onclick="openAddWlModalPage()">＋ 新增候補</button>
  </div>
  <div id="waitlistPageContent"><p style="color:var(--text3);padding:28px;text-align:center">尚無候補紀錄</p></div>
</div>

<!-- ═══ PAGE: 異動紀錄 ═══ -->
<div class="page" id="page-changes">
  <div class="toolbar">
    <button class="btn primary" onclick="openChangeModal()">＋ 新增異動</button>
    <select id="changeTypeFilter" onchange="renderChanges()">
      <option value="">所有類型</option>
      <option>暫停</option><option>退出</option><option>轉班</option><option>釋出學位</option><option>候補升正</option>
    </select>
  </div>
  <div id="changeList"><p style="color:var(--text3);padding:28px;text-align:center">尚無異動紀錄</p></div>
</div>

<!-- ═══ PAGE: 匯入資料 ═══ -->
<div class="page" id="page-import">
  <div class="card">
    <div class="card-title">匯入出席 CSV</div>
    <p style="color:var(--text2);font-size:12px;margin-bottom:14px">每月匯出出席紀錄 CSV，拖入此處自動分析缺席警示。支援多檔同時匯入。</p>
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('csvInput').click()">
      <div style="font-size:32px">📂</div>
      <p>點擊選擇 CSV，或拖曳至此</p>
      <p style="font-size:10px;color:var(--text3);margin-top:4px">支援多檔同時上傳</p>
    </div>
    <input type="file" id="csvInput" accept=".csv" multiple style="display:none" onchange="handleCSVFiles(this.files)">
    <div id="importLog" style="margin-top:14px;font-size:12px;color:var(--text2)"></div>
  </div>
  <div class="card">
    <div class="card-title">警示門檻設定</div>

// ══════════════════════════════════════════
// SEAT KEY — unique ID for a course card
// ══════════════════════════════════════════
function seatKey(tab,sIdx,rIdx,col,cIdx){
  return `${tab}|${sIdx}|${rIdx}|${col}|${cIdx}`;
}

// ══════════════════════════════════════════
// SCHEDULE TABLE
// ══════════════════════════════════════════
function switchTab(tab,el){
  _currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  closeSeatPanel();
  renderTable();
}

function getCols(tab){
  return tab==='6+'?['二','三','四','五','六A','六B','日A','日B']:['三','四','五','六A','六B','日A','日B'];
}
function colLabel(c){
  if(c==='六A')return{main:'六',sub:'①'};if(c==='六B')return{main:'六',sub:'②'};
  if(c==='日A')return{main:'日',sub:'①'};if(c==='日B')return{main:'日',sub:'②'};
  return{main:c,sub:''};
}

function getAlertForStudent(name){
  const a=(window.ALERT_DATA||[]).find(r=>r.會員&&r.會員.replace(/[（）()].*/,'').trim()===name.trim());
  if(!a)return'';
  if(a.風險等級==='應釋出學位')return'red';
  if(a.風險等級==='持續觀察')return'amber';
  return'';
}

function renderTable(){
  const tab=_currentTab;
  const schData=window.SCHEDULE[tab];
  if(!schData){document.getElementById('tableContainer').innerHTML='';return;}
  const cols=getCols(tab);

  let html='<table class="schedule-table"><thead><tr>';
  html+='<th style="width:22px"></th><th class="time-label" style="width:48px">時段</th>';
  cols.forEach(c=>{
    const lb=colLabel(c);
    const cls=c.startsWith('六')?'sat-head':c.startsWith('日')?'sun-head':'';
    html+=`<th class="${cls}">${lb.main}${lb.sub?`<br><span class="col-sub">${lb.sub}</span>`:''}`;
    if(c==='六A')html+=`<br><span class="col-sub" style="font-size:8px;color:#c08050">①②共欄</span>`;
    html+='</th>';
  });
  html+='</tr></thead><tbody>';

  schData.sections.forEach((sec,sIdx)=>{
    let firstRow=true;
    sec.rows.forEach((row,rIdx)=>{
      html+='<tr>';
      if(firstRow){
        html+=`<td class="section-label" rowspan="${sec.rows.length}">${sec.name}</td>`;
        firstRow=false;
      }
      html+=`<td class="time-label">${row.label}</td>`;
      cols.forEach(col=>{
        const cards=row.cells[col]||[];
        const cellClass=col.startsWith('六')?'cell-sat':col.startsWith('日')?'cell-sun':'';
        html+=`<td class="${cellClass}"><div class="cell-inner">`;
        cards.forEach((c,cIdx)=>{
          const key=seatKey(tab,sIdx,rIdx,col,cIdx);
          const seat=window.SEATS[key]||{students:[],capacity:defaultCap(c.name),waitlist:[]};
          const count=seat.students.length;const cap=seat.capacity||defaultCap(c.name);
          const pct=Math.min(count/cap*100,100);
          const fillCls=pct>=100?'full':pct>=85?'near':'';
          const hasAlert=seat.students.some(s=>getAlertForStudent(s.name)==='red');
          const hasObs=!hasAlert&&seat.students.some(s=>getAlertForStudent(s.name)==='amber');
          const alertCls=hasAlert?'has-alert':hasObs?'has-observe':'';
          const bg=COLORS[c.color]?.bg||COLORS[0].bg;
          const bd=COLORS[c.color]?.bd||COLORS[0].bd;
          html+=`<div class="course-card ${alertCls}" style="background:${bg};border-color:${bd}"
            onclick="openSeatPanel('${tab}',${sIdx},${rIdx},'${col}',${cIdx})">
            ${c.isNew?'<span class="badge-new">NEW</span>':''}
            <span class="ci">${c.icon||'🎨'}</span>
            <div class="cn">${c.name}</div>
            <div class="ct">${c.time}</div>
            <div class="seat-bar"><div class="seat-fill ${fillCls}" style="width:${pct}%"></div></div>
            <div class="seat-count">${count}/${cap}人${seat.waitlist&&seat.waitlist.length?` ・候補${seat.waitlist.length}`:''}${hasAlert?' 🔴':hasObs?' 🟡':''}</div>
          </div>`;
        });
        html+=`<button class="add-btn" onclick="openAddCourseModal('${tab}',{sIdx:${sIdx},rIdx:${rIdx},col:'${col}'})">＋</button>`;
        html+='</div></td>';
      });
      html+='</tr>';
    });
  });
  html+='</tbody></table>';
  document.getElementById('tableContainer').innerHTML=html;
}

function defaultCap(name){
  if(!name)return 8;
  if(name.includes('9-12'))return 12;
  if(name.includes('6-8'))return 10;
  if(name.includes('4-5'))return 8;
  if(name.includes('2-3'))return 7;
  return 8;
}

// ══════════════════════════════════════════
// SEAT PANEL
// ══════════════════════════════════════════
function openSeatPanel(tab,sIdx,rIdx,col,cIdx){
  const c=window.SCHEDULE[tab].sections[sIdx].rows[rIdx].cells[col][cIdx];
  const key=seatKey(tab,sIdx,rIdx,col,cIdx);
  if(!window.SEATS[key])window.SEATS[key]={students:[],capacity:defaultCap(c.name),waitlist:[]};
  _activeCourse={tab,sIdx,rIdx,col,cIdx,key};
  document.getElementById('seatPanel').classList.add('open');
  refreshSeatPanel();
}

function refreshSeatPanel(){
  if(!_activeCourse)return;
  const{tab,sIdx,rIdx,col,cIdx,key}=_activeCourse;
  const c=window.SCHEDULE[tab].sections[sIdx].rows[rIdx].cells[col][cIdx];
  const seat=window.SEATS[key]||{students:[],capacity:defaultCap(c.name),waitlist:[]};
  const students=seat.students||[];
  const cap=seat.capacity||defaultCap(c.name);
  const wl=seat.waitlist||[];
  const pct=Math.min(students.length/cap*100,100);
  const fillCls=pct>=100?'full':pct>=85?'near':'';

  document.getElementById('spTitle').textContent=`${c.icon} ${c.name}`;
  document.getElementById('spMeta').textContent=`週${col.replace('A','').replace('B','')}  ${c.time}`;
  document.getElementById('spCapFill').className='seat-cap-fill '+fillCls;
  document.getElementById('spCapFill').style.width=pct+'%';
  document.getElementById('spCapText').textContent=`${students.length}/${cap}`;

  // Students
  document.getElementById('spStudents').innerHTML=students.length?students.map((s,i)=>{
    const al=getAlertForStudent(s.name);
    const alCls=al==='red'?'alert-red':al==='amber'?'alert-amber':'';
    const pauseCls=s.status==='暫停'?'paused':'';
    return`<div class="student-chip ${alCls} ${pauseCls}">
      <span class="sc-name">${s.name}</span>
      ${s.status&&s.status!=='正常'?`<span class="sc-badge">${s.status}</span>`:''}
      ${s.note?`<span class="sc-note">${s.note}</span>`:''}
      ${al==='red'?'<span style="font-size:10px">🔴</span>':al==='amber'?'<span style="font-size:10px">🟡</span>':''}
      <button class="sc-rm" onclick="removeStudent(${i})" title="移除">×</button>
    </div>`;
  }).join(''):'<p style="font-size:11px;color:var(--text3);padding:4px 0">尚無固定學位學生</p>';

  // Waitlist
  document.getElementById('spWaitlist').innerHTML=wl.length?wl.map((w,i)=>`
    <div class="waitlist-item">
      <div class="wl-num">${i+1}</div>
      <div class="wl-info"><div class="wl-name">${w.name}</div><div class="wl-meta">${w.phone||''} ${w.note?'・'+w.note:''}</div></div>
      <button class="btn" style="font-size:10px;padding:2px 7px" onclick="promoteWl(${i})">升正</button>
      <button class="btn danger" style="font-size:10px;padding:2px 7px" onclick="removeWl(${i})">×</button>
    </div>`).join(''):'<p style="font-size:11px;color:var(--text3);padding:4px 0">尚無候補</p>';
}

function closeSeatPanel(){
  document.getElementById('seatPanel').classList.remove('open');
  _activeCourse=null;
}

async function saveSeat(){
  if(!_activeCourse)return;
  const{key}=_activeCourse;
  await window.fbSet('seats/'+key.replace(/\|/g,'_'),window.SEATS[key]);
  renderTable();
  refreshSeatPanel();
}

async function addStudentFromInput(){
  const inp=document.getElementById('newStudentInput');
  const name=inp.value.trim();
  if(!name){toast('請輸入姓名',true);return;}
  const{key}=_activeCourse;
  if(!window.SEATS[key])window.SEATS[key]={students:[],capacity:8,waitlist:[]};
  if(window.SEATS[key].students.some(s=>s.name===name)){toast('已在名單中',true);return;}
  window.SEATS[key].students.push({name,status:'正常',note:'',addedAt:Date.now()});
  inp.value='';
  document.getElementById('studentSuggBox').style.display='none';
  await saveSeat();
  toast(`${name} 已加入`);
}

async function removeStudent(i){
  const{key}=_activeCourse;
  const name=window.SEATS[key].students[i]?.name;
  if(!confirm(`移除「${name}」？`))return;
  window.SEATS[key].students.splice(i,1);
  await saveSeat();
  toast(`${name} 已移除`);
}

async function editCapacity(){
  const{key}=_activeCourse;
  const cur=window.SEATS[key]?.capacity||8;
  const val=prompt('學位上限（目前：'+cur+'）：');
  if(!val)return;
  const n=parseInt(val);
  if(isNaN(n)||n<1){toast('請輸入有效數字',true);return;}
  if(!window.SEATS[key])window.SEATS[key]={students:[],capacity:n,waitlist:[]};
  window.SEATS[key].capacity=n;
  await saveSeat();
}

function filterStudentSugg(){
  const val=document.getElementById('newStudentInput').value.trim().toLowerCase();
  const box=document.getElementById('studentSuggBox');
  if(!val){box.style.display='none';return;}
  const names=new Set();
  (window.ALERT_DATA||[]).forEach(a=>{if(a.會員)names.add(a.會員)});
  Object.values(window.SEATS||{}).forEach(s=>(s.students||[]).forEach(st=>names.add(st.name)));
  const matches=[...names].filter(n=>n.toLowerCase().includes(val)).slice(0,8);
  if(!matches.length){box.style.display='none';return;}
  box.style.display='block';
  box.innerHTML=matches.map(n=>`<div class="suggest-item" onmousedown="document.getElementById('newStudentInput').value='${n}';document.getElementById('studentSuggBox').style.display='none'">${n}</div>`).join('');
}

function openAddWlModal(){
  document.getElementById('wl-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('wlModal').classList.add('open');
  document.getElementById('wlModal').dataset.mode='panel';
}

async function saveWaitlistModal(){
  const name=document.getElementById('wl-name').value.trim();
  if(!name){toast('請填寫姓名',true);return;}
  const mode=document.getElementById('wlModal').dataset.mode;
  if(mode==='panel'&&_activeCourse){
    const{key}=_activeCourse;
    if(!window.SEATS[key])window.SEATS[key]={students:[],capacity:8,waitlist:[]};
    window.SEATS[key].waitlist=window.SEATS[key].waitlist||[];
    window.SEATS[key].waitlist.push({name,phone:document.getElementById('wl-phone').value.trim(),note:document.getElementById('wl-note').value.trim(),date:document.getElementById('wl-date').value});
    await saveSeat();
  } else {
    await window.fbPush('waitlist',{name,phone:document.getElementById('wl-phone').value.trim(),time:document.getElementById('wl-time').value.trim(),note:document.getElementById('wl-note').value.trim(),date:document.getElementById('wl-date').value,createdAt:Date.now()});
    await window.loadAll();
  }
  closeModal('wlModal');
  ['wl-name','wl-phone','wl-time','wl-note'].forEach(id=>document.getElementById(id).value='');
  toast('候補已新增');
}

async function promoteWl(i){
  const{key}=_activeCourse;
  const w=window.SEATS[key].waitlist[i];
  if(!confirm(`將「${w.name}」升為正式學位？`))return;
  window.SEATS[key].students.push({name:w.name,status:'正常',note:'',addedAt:Date.now()});
  window.SEATS[key].waitlist.splice(i,1);
  await saveSeat();
  await window.fbPush('changes',{類型:'候補升正',學員:w.name,課程:_activeCourse?window.SCHEDULE[_activeCourse.tab].sections[_activeCourse.sIdx].rows[_activeCourse.rIdx].cells[_activeCourse.col][_activeCourse.cIdx].name:'',日期:new Date().toISOString().slice(0,10),建立時間:Date.now()});
  await window.loadAll();
  toast(`${w.name} 已升為正式學位`);
}

async function removeWl(i){
  const{key}=_activeCourse;
  const name=window.SEATS[key].waitlist[i]?.name;
  if(!confirm(`移除候補「${name}」？`))return;
  window.SEATS[key].waitlist.splice(i,1);
  await saveSeat();
}

// COURSE MODAL (新增/編輯課程)

function buildIconPicker(){
  document.getElementById('iconPicker').innerHTML=ICONS.map((ic,i)=>
    `<div class="icon-opt${i===0?' sel':''}" onclick="selectIcon('${ic}',this)">${ic}</div>`).join('');
  _selectedIcon=ICONS[0];
}
function buildColorPicker(){
  document.getElementById('colorPicker').innerHTML=COLORS.map((c,i)=>
    `<div class="color-opt${i===0?' sel':''}" style="background:${c.bg};border-color:${c.bd}" onclick="selectColor(${i},this)"></div>`).join('');
  _selectedColor=0;
}
function selectIcon(ic,el){
  _selectedIcon=ic;
  document.querySelectorAll('.icon-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
}
function selectColor(i,el){
  _selectedColor=i;
  document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
}

function openAddCourseModal(tab,pos){
  _editCourseTarget={mode:'add',tab:tab||_currentTab,pos};
  buildIconPicker();buildColorPicker();
  document.getElementById('courseModalTitle').textContent='新增課程';
  document.getElementById('cm-name').value='';
  document.getElementById('cm-time').value='';
  document.getElementById('cm-new').checked=false;
  document.getElementById('cm-cap').value=8;
  document.getElementById('cmDeleteBtn').style.display='none';
  document.getElementById('courseModal').classList.add('open');
}

function openEditCourseModal(){
  if(!_activeCourse)return;
  const{tab,sIdx,rIdx,col,cIdx}=_activeCourse;
  const c=window.SCHEDULE[tab].sections[sIdx].rows[rIdx].cells[col][cIdx];
  _editCourseTarget={mode:'edit',tab,sIdx,rIdx,col,cIdx};
  buildIconPicker();buildColorPicker();
  _selectedIcon=c.icon||ICONS[0];
  _selectedColor=c.color||0;
  document.querySelectorAll('.icon-opt').forEach((el,i)=>el.classList.toggle('sel',ICONS[i]===c.icon));
  document.querySelectorAll('.color-opt').forEach((el,i)=>el.classList.toggle('sel',i===c.color));
  document.getElementById('courseModalTitle').textContent='編輯課程';
  document.getElementById('cm-name').value=c.name;
  document.getElementById('cm-time').value=c.time;
  document.getElementById('cm-new').checked=c.isNew||false;
  document.getElementById('cm-cap').value=window.SEATS[_activeCourse.key]?.capacity||defaultCap(c.name);
  document.getElementById('cmDeleteBtn').style.display='inline-flex';
  document.getElementById('courseModal').classList.add('open');
}

async function saveCourseModal(){
  const name=document.getElementById('cm-name').value.trim();
  const time=document.getElementById('cm-time').value.trim();
  if(!name||!time){toast('請填寫課程名稱和時間',true);return;}
  const cap=parseInt(document.getElementById('cm-cap').value)||8;
  const t=_editCourseTarget;

  if(t.mode==='add'){
    const tab=t.tab||_currentTab;
    const sch=window.SCHEDULE[tab];
    if(t.pos){
      const{sIdx,rIdx,col}=t.pos;
      sch.sections[sIdx].rows[rIdx].cells[col]=sch.sections[sIdx].rows[rIdx].cells[col]||[];
      sch.sections[sIdx].rows[rIdx].cells[col].push({name,time,icon:_selectedIcon,color:_selectedColor,isNew:document.getElementById('cm-new').checked});
    } else {
      // Add new row to first section
      if(!sch.sections[0])sch.sections[0]={name:'新時段',rows:[]};
      sch.sections[0].rows.push({label:time,cells:{[document.getElementById('cm-name').value.split(' ')[0]]:[{name,time,icon:_selectedIcon,color:_selectedColor,isNew:false}]}});
    }
  } else {
    const{tab,sIdx,rIdx,col,cIdx,key}=_activeCourse;
    window.SCHEDULE[tab].sections[sIdx].rows[rIdx].cells[col][cIdx]={name,time,icon:_selectedIcon,color:_selectedColor,isNew:document.getElementById('cm-new').checked};
    if(!window.SEATS[key])window.SEATS[key]={students:[],capacity:cap,waitlist:[]};
    window.SEATS[key].capacity=cap;
    await window.fbSet('seats/'+key.replace(/\|/g,'_'),window.SEATS[key]);
  }

  await window.fbSet('schedule',window.SCHEDULE);
  closeModal('courseModal');
  renderTable();
  toast('已儲存');
  if(_activeCourse)refreshSeatPanel();
}

async function deleteCourseModal(){
  if(!_editCourseTarget||_editCourseTarget.mode!=='edit')return;
  const{tab,sIdx,rIdx,col,cIdx}=_activeCourse;
  const name=window.SCHEDULE[tab].sections[sIdx].rows[rIdx].cells[col][cIdx].name;
  if(!confirm(`確定刪除「${name}」？`))return;
  window.SCHEDULE[tab].sections[sIdx].rows[rIdx].cells[col].splice(cIdx,1);
  await window.fbSet('schedule',window.SCHEDULE);
  closeModal('courseModal');closeSeatPanel();renderTable();toast('課程已刪除');
}

async function deleteCourseFromPanel(){
  if(!_activeCourse)return;
  openEditCourseModal();
  await deleteCourseModal();
}

async function saveChange(){
  const name=document.getElementById('chg-name').value.trim();
  if(!name){toast('請填寫學員姓名',true);return;}
  await window.fbPush('changes',{類型:document.getElementById('chg-type').value,學員:name,課程:document.getElementById('chg-class').value.trim(),日期:document.getElementById('chg-date').value,備註:document.getElementById('chg-note').value.trim(),經手人:document.getElementById('chg-handler').value.trim(),建立時間:Date.now()});
  closeModal('changeModal');
  ['chg-name','chg-class','chg-note','chg-handler'].forEach(id=>document.getElementById(id).value='');
  await window.loadAll();
  toast('異動已記錄');
}

function renderChanges(){
  const data=window.CHANGES||[];
  const filter=document.getElementById('changeTypeFilter').value;
  const cont=document.getElementById('changeList');
  const filtered=(filter?data.filter(c=>c.類型===filter):data).sort((a,b)=>(b.建立時間||0)-(a.建立時間||0));
  if(!filtered.length){cont.innerHTML='<p style="color:var(--text3);padding:28px;text-align:center">尚無異動紀錄</p>';return;}
  const colors={暫停:'var(--amber)',退出:'var(--red)',轉班:'var(--blue,#185FA5)',釋出學位:'var(--red)',候補升正:'var(--green)'};
  cont.innerHTML='<div class="card">'+filtered.map(c=>`
    <div class="history-item">
      <div class="h-dot" style="background:${colors[c.類型]||'#999'}"></div>
      <div class="h-content">
        <div><span class="badge ${c.類型==='候補升正'?'green':c.類型==='暫停'?'amber':'red'}" style="margin-right:6px">${c.類型}</span><strong>${c.學員||''}</strong>${c.課程?' ・'+c.課程:''}</div>
        <div class="h-meta">${c.日期||''} ${c.經手人?'・'+c.經手人:''}</div>
        ${c.備註?`<div style="font-size:11px;color:var(--text2);margin-top:2px">${c.備註}</div>`:''}
      </div>
      <button class="btn danger" style="font-size:10px;padding:2px 7px;flex-shrink:0" onclick="deleteChange('${c._key}')">刪除</button>
    </div>`).join('')+'</div>';
}

async function deleteChange(key){
  if(!confirm('確定刪除此異動紀錄？'))return;
  await window.fbRemove('changes/'+key);
  await window.loadAll();
}

// ══════════════════════════════════════════
// ALERT TABLE
// ══════════════════════════════════════════
function setAlertFilter(f,el){
  _alertFilter=f;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  renderAlertTable();
}

function renderAlertTable(){
  const data=window.ALERT_DATA||[];
  const search=(document.getElementById('alertSearch')?.value||'').toLowerCase();
  const age=document.getElementById('alertAge')?.value||'';
  const tbody=document.getElementById('alertBody');
  let filtered=data.filter(r=>{
    const matchF=_alertFilter==='all'||r.風險等級===_alertFilter;
    const matchS=!search||r.會員.toLowerCase().includes(search);
    const matchA=!age||r.課程.startsWith(age);
    return matchF&&matchS&&matchA&&r.風險等級;
  }).sort((a,b)=>{const o={應釋出學位:0,持續觀察:1,正常追蹤:2};return(o[a.風險等級]||9)-(o[b.風險等級]||9)||b.缺席率-a.缺席率;});

  // Stats
  document.getElementById('s-total').textContent=data.length;
  document.getElementById('s-red').textContent=data.filter(r=>r.風險等級==='應釋出學位').length;
  document.getElementById('s-amber').textContent=data.filter(r=>r.風險等級==='持續觀察').length;
  const months=new Set(data.flatMap(r=>(r.出現月份||'').split('/').filter(Boolean)));
  document.getElementById('s-coverage').textContent=[...months].sort().join('、')||'—';

  if(!filtered.length){tbody.innerHTML=`<tr><td colspan="11" style="text-align:center;color:var(--text3);padding:24px">${data.length?'無符合條件紀錄':'尚未匯入資料'}</td></tr>`;return;}
  const riskBadge=r=>r==='應釋出學位'?'<span class="badge red">🔴 應釋出</span>':r==='持續觀察'?'<span class="badge amber">🟡 觀察</span>':'<span class="badge green">🟢 追蹤</span>';
  tbody.innerHTML=filtered.map(r=>`<tr>
    <td>${riskBadge(r.風險等級)}</td>
    <td><strong>${r.會員}</strong></td><td>${r.課程}</td><td>${r.教室}</td><td>${r.老師||'—'}</td>
    <td>${r.總堂數}</td><td>${r.缺席堂數}</td>
    <td style="font-weight:600;color:${r.缺席率>=50?'var(--red)':r.缺席率>=30?'var(--amber)':'inherit'}">${r.缺席率}%</td>
    <td>${r.最長連續缺席>=3?`<span style="color:var(--red);font-weight:600">${r.最長連續缺席}堂</span>`:r.最長連續缺席}</td>
    <td>${r.出現月份||'—'}</td>
    <td><button class="btn" style="font-size:10px;padding:2px 7px" onclick="quickChange('${r.會員}','${r.課程}')">記錄異動</button></td>
  </tr>`).join('');
}

function quickChange(name,course){
  document.getElementById('chg-name').value=name;
  document.getElementById('chg-class').value=course;
  document.getElementById('chg-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('changeModal').classList.add('open');
  showPage('changes',document.querySelectorAll('.nav-tab')[3]);
}

function exportAlertCSV(){
  const data=(window.ALERT_DATA||[]).filter(r=>r.風險等級);
  if(!data.length){toast('沒有資料',true);return;}
  const h=['風險等級','學員','課程','教室','老師','總堂數','缺席堂數','缺席率','連續缺席','月份'];
  const rows=data.map(r=>[r.風險等級,r.會員,r.課程,r.教室,r.老師||'',r.總堂數,r.缺席堂數,r.缺席率+'%',r.最長連續缺席,r.出現月份||'']);
  const csv=[h,...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`學位警示_${new Date().toISOString().slice(0,10)}.csv`;a.click();
}

// ══════════════════════════════════════════
// CSV IMPORT
// ══════════════════════════════════════════
const dropZone=document.getElementById('dropZone');
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag');handleCSVFiles(e.dataTransfer.files)});

function handleCSVFiles(files){
  if(!files.length)return;
  const log=document.getElementById('importLog');
  log.innerHTML='<p>讀取中…</p>';
  Promise.all([...files].map(f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res({name:f.name,text:e.target.result});r.onerror=rej;r.readAsText(f,'UTF-8')}))).then(results=>{
    let all=[];let fl='';
    results.forEach(({name,text})=>{
      const bom=text.charCodeAt(0)===0xFEFF?text.slice(1):text;
      const rows=parseCSV(bom);all=all.concat(rows);
      fl+=`<p>✅ ${name}：${rows.length} 筆</p>`;
    });
    log.innerHTML=fl+`<p style="margin-top:8px">合計 ${all.length} 筆，分析中…</p>`;
    analyzeCSV(all,log);
  });
}

function parseCSV(text){
  const lines=text.split('\n').filter(l=>l.trim());if(!lines.length)return[];
  const headers=lines[0].split(',').map(h=>h.replace(/"/g,'').trim());
  return lines.slice(1).map(line=>{
    const vals=[];let cur='',inQ=false;
    for(const ch of line){if(ch==='"')inQ=!inQ;else if(ch===','&&!inQ){vals.push(cur.trim());cur='';}else cur+=ch;}
    vals.push(cur.trim());
    const obj={};headers.forEach((h,i)=>obj[h]=vals[i]||'');return obj;
  }).filter(r=>r['會員']&&r['課程']);
}

async function analyzeCSV(rows,log){
  const thR=parseInt(document.getElementById('threshRed').value)||50;
  const thS=parseInt(document.getElementById('threshStreak').value)||3;
  const thA=parseInt(document.getElementById('threshAmber').value)||30;
  const thM=parseInt(document.getElementById('threshMin').value)||2;

  const groups={};
  rows.forEach(r=>{
    const k=`${r['會員']}|${r['課程']}|${r['教室']}`;
    if(!groups[k])groups[k]={會員:r['會員'],課程:r['課程'],教室:r['教室'],老師:r['老師']||'',rows:[]};
    groups[k].rows.push(r);
  });

  const alertData=Object.values(groups).map(g=>{
    const sorted=g.rows.sort((a,b)=>a['日期']<b['日期']?-1:1);
    const 總堂數=sorted.length;
    const 缺席堂數=sorted.filter(r=>r['缺席']==='是').length;
    const 缺席率=Math.round(缺席堂數/總堂數*1000)/10;
    const months=[...new Set(sorted.map(r=>r['日期'].slice(5,7).replace(/^0/,'')+'月'))].sort();
    let mx=0,cur=0;sorted.forEach(r=>{cur=r['缺席']==='是'?cur+1:0;mx=Math.max(mx,cur)});
    const r3=sorted.slice(-3).filter(r=>r['缺席']==='是').length;
    const rec={...g,總堂數,缺席堂數,缺席率,最長連續缺席:mx,近3堂缺席:r3,出現月份:months.join('/')};
    if(總堂數<thM)rec.風險等級='';
    else if(缺席率>=thR||mx>=thS)rec.風險等級='應釋出學位';
    else if(缺席率>=thA||r3>=2)rec.風險等級='持續觀察';
    else if(缺席率>=15)rec.風險等級='正常追蹤';
    else rec.風險等級='';
    return rec;
  }).filter(r=>r.缺席堂數>0||r.總堂數>=thM);

  window.ALERT_DATA=alertData;
  await window.fbSet('alertData',alertData);
  const red=alertData.filter(r=>r.風險等級==='應釋出學位').length;
  const amber=alertData.filter(r=>r.風險等級==='持續觀察').length;
  log.innerHTML+='<br><strong style="color:var(--green)">✅ 分析完成！</strong> '+
    `🔴 ${red} 位應釋出學位　🟡 ${amber} 位持續觀察`;
  renderAlertTable();renderTable();
  toast('CSV 分析完成');
}

async function clearAttendance(){
  if(!confirm('確定清除所有出席資料？'))return;
  window.ALERT_DATA=[];
  await window.fbSet('alertData',[]);
  renderAlertTable();renderTable();toast('已清除');
}
